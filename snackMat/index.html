<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SnackMat - El toque delicioso de tu celebración</title>

  <!-- Meta tags SEO y Redes Sociales -->
  <meta name="description" content="SnackMat - El toque delicioso de tu celebración. Cotizaciones para eventos especiales por WhatsApp y redes sociales.">
  <meta property="og:title" content="SnackMat">
  <meta property="og:description" content="El toque delicioso de tu celebración. Contáctanos y cotiza tu evento.">
  <meta property="og:image" content="assets/logo.jpeg">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#f5f1eb">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/logo.jpeg">
  <link rel="apple-touch-icon" href="assets/logo.jpeg">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg-page: #f5f1eb;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #64748b;
      --color-whatsapp: #288a58;
      --color-whatsapp-hover: #22794c;
      --color-facebook: #3b5998;
      --color-facebook-hover: #2f477a;
      --color-gold: #9e6c2e;
      --color-gold-dark: #6e461b;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem 1.75rem;
      line-height: 1.5;
    }

    /* Contenedor tipo Tarjeta Móvil */
    .phone-card {
      width: 100%;
      max-width: 410px;
      background: var(--card-bg);
      border-radius: 2.5rem;
      padding: 2rem 1.5rem 1.75rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.12),
                  0 8px 24px -4px rgba(0, 0, 0, 0.05),
                  0 0 0 1px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* ==============================================================
       1. TARJETA DE CONTACTO HERO (EN LA PARTE SUPERIOR CON LOGO DENTRO)
       ============================================================== */
    .contact-hero-card {
      width: 100%;
      background: #ffffff;
      border: 1.5px solid #eae3d9;
      border-radius: 1.75rem;
      padding: 1.25rem 1.2rem 1.35rem;
      box-shadow: 0 8px 25px -4px rgba(158, 108, 46, 0.1),
                  0 3px 8px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      margin-bottom: 1.25rem;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .contact-hero-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -4px rgba(158, 108, 46, 0.16),
                  0 4px 12px rgba(0, 0, 0, 0.05);
      border-color: #d8c8b6;
    }

    .contact-hero-card:active {
      transform: scale(0.985);
    }

    /* Título Contact Card */
    .contact-card-title {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--color-gold-dark);
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Logo dentro de la tarjeta de contacto */
    .card-logo-container {
      width: 175px;
      height: 175px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .card-brand-logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 6px 18px rgba(158, 108, 46, 0.16);
      transition: transform 0.25s ease;
    }

    .contact-hero-card:hover .card-brand-logo {
      transform: scale(1.03);
    }

    /* Botón / Pastilla de Acción: Añadir a mi agenda */
    .card-save-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      background: #faf6f0;
      border: 1px solid #ebd9c5;
      border-radius: 9999px;
      padding: 0.6rem 1.25rem;
      color: var(--color-gold-dark);
      font-size: 0.92rem;
      font-weight: 700;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(158, 108, 46, 0.06);
    }

    .contact-hero-card:hover .card-save-action {
      background: #f5ecd9;
      border-color: #dfc3a2;
      color: #553310;
    }

    .contact-add-icon {
      width: 1.25rem;
      height: 1.25rem;
      color: var(--color-gold);
    }

    /* ==============================================================
       2. PILA DE ACCIONES (WHATSAPP + REDES SOCIALES)
       ============================================================== */
    .actions-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    /* Botón WhatsApp */
    .btn-whatsapp {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      padding: 0.88rem 1.25rem;
      border-radius: 0.85rem;
      text-decoration: none;
      font-size: 0.98rem;
      font-weight: 700;
      background: var(--color-whatsapp);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(40, 138, 88, 0.3);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      border: none;
      cursor: pointer;
    }

    .btn-whatsapp:hover {
      background: var(--color-whatsapp-hover);
      box-shadow: 0 6px 18px rgba(40, 138, 88, 0.4);
      transform: translateY(-1px);
    }

    .btn-whatsapp:active {
      transform: scale(0.98);
    }

    .btn-icon {
      width: 1.35rem;
      height: 1.35rem;
      flex-shrink: 0;
      fill: currentColor;
    }

    /* Fila de Redes Sociales (Solo Íconos Más Grandes) */
    .social-row {
      display: flex;
      gap: 0.85rem;
      width: 100%;
    }

    .btn-social {
      flex: 1;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.85rem;
      text-decoration: none;
      color: #ffffff;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .btn-social:hover {
      transform: translateY(-2px);
    }

    .btn-social:active {
      transform: scale(0.97);
    }

    /* Ícono más grande */
    .social-icon-lg {
      width: 30px;
      height: 30px;
      fill: #ffffff;
      transition: transform 0.2s ease;
    }

    .btn-social:hover .social-icon-lg {
      transform: scale(1.08);
    }

    /* Instagram */
    .btn-instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      box-shadow: 0 4px 14px rgba(220, 39, 67, 0.3);
    }

    .btn-instagram:hover {
      box-shadow: 0 6px 20px rgba(220, 39, 67, 0.4);
    }

    /* Facebook */
    .btn-facebook {
      background: var(--color-facebook);
      box-shadow: 0 4px 14px rgba(59, 89, 152, 0.3);
    }

    .btn-facebook:hover {
      background: var(--color-facebook-hover);
      box-shadow: 0 6px 20px rgba(59, 89, 152, 0.4);
    }

    /* Barra inferior estilo Home Indicator */
    .home-indicator {
      width: 130px;
      height: 4.5px;
      background: #111827;
      border-radius: 9999px;
      margin-top: 1.5rem;
      margin-bottom: 0.25rem;
      opacity: 0.85;
    }

    /* Footer con leyenda de AIT3D */
    .footer {
      margin-top: 1.5rem;
      display: flex;
      justify-content: center;
    }

    .footer-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #ffffff;
      color: #334155;
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      font-size: 0.75rem;
      font-weight: 500;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .footer-pill img {
      width: 1rem;
      height: 1rem;
      object-fit: contain;
      border-radius: 9999px;
    }

    .footer-pill strong {
      color: #0b1c30;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <!-- Tarjeta Central Móvil -->
  <main class="phone-card">

    <!-- Botón Volver al Menú Principal -->
    <div style="width: 100%; display: flex; justify-content: flex-start; margin-bottom: 0.75rem;">
      <a href="../index.html" style="display: inline-flex; align-items: center; gap: 0.4rem; color: #64748b; text-decoration: none; font-size: 0.8rem; font-weight: 600; padding: 0.35rem 0.75rem; border-radius: 9999px; background: rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.06); transition: all 0.2s;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>Menú de Demos</span>

    <!-- 1. Tarjeta de Contacto Principal con el Logo Dentro -->

      <!-- Título de la tarjeta -->
      <span class="contact-card-title">Contact Card</span>

      <!-- Logo dentro de la tarjeta de contacto -->
      <div class="card-logo-container">
        <img src="assets/logo.jpeg" alt="SnackMat - El toque delicioso de tu celebración" class="card-brand-logo">
      </div>

      <!-- Pastilla de acción: Añadir a mi agenda -->
      <div class="card-save-action">
        <svg class="contact-add-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
        <span>Añadir a mi agenda</span>
      </div>

    </div>

    <!-- 2. Pila de Acciones: WhatsApp y Redes Sociales -->
    <section class="actions-stack" aria-label="Enlaces de contacto">

      <!-- Botón: Cotiza por WhatsApp -->
      <a id="btn-whatsapp" class="btn-whatsapp" href="https://wa.me/525570790228?text=Hola%20Snack%20Mat,%20me%20gustar%C3%ADa%20cotizar%20un%20servicio%20para%20mi%20evento." target="_blank" rel="noopener noreferrer">
        <svg class="btn-icon" viewBox="0 0 24 24">
          <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2zm.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.196 8.196 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24zm4.52 11.66c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.02-1.25-.75-.67-1.26-1.5-1.41-1.75-.14-.25-.02-.39.11-.51.11-.11.25-.29.37-.44.13-.14.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.34-.76-1.84-.2-.49-.4-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.13.17 1.77 2.71 4.3 3.8 2.52 1.09 2.52.73 2.98.69.45-.04 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.12-.22-.19-.47-.32z"/>
        </svg>
        <span>Cotiza por WhatsApp</span>
      </a>

      <!-- Redes Sociales: Solo Íconos Más Grandes -->
      <div class="social-row">
        <!-- Instagram -->
        <a id="btn-instagram" class="btn-social btn-instagram" href="https://instagram.com/SnackMat.mx" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg class="social-icon-lg" viewBox="0 0 24 24">
            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
          </svg>
        </a>

        <!-- Facebook -->
        <a id="btn-facebook" class="btn-social btn-facebook" href="https://facebook.com/SnackMatOficial" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
          <svg class="social-icon-lg" viewBox="0 0 24 24">
            <path d="M22.675 0h-21.35C.597 0 0 .597 0 1.326v21.348C0 23.403.597 24 1.326 24H12.82v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116c.73 0 1.325-.597 1.325-1.326V1.326C24 .597 23.405 0 22.675 0z"/>
          </svg>
        </a>
      </div>

    </section>

    <!-- Indicador Home Móvil -->
    <div class="home-indicator" aria-hidden="true"></div>

  </main>

  <!-- Footer Atribución AIT3D -->
  <footer class="footer">
    <div class="footer-pill">
      <img src="assets/ait3d-logo.png" alt="AIT3D" width="16" height="16">
      <span>Desarrollado por <strong>AIT3D software</strong></span>
    </div>
  </footer>

  <script>
    // ==============================================================
    // CONFIGURACIÓN DE CONTACTO SNACK MAT
    // ==============================================================
    const CONFIG = {
      phone: "525570790228",
      whatsappMsg: "Hola Snack Mat, me gustaría cotizar un servicio para mi evento."
    };

    // Descarga interactiva de tarjeta de contacto (.vcf)
    function downloadVCard() {
      const vcardContent = `BEGIN:VCARD
VERSION:3.0
N:Mat;Snack;;;
FN:Snack Mat
ORG:Snack Mat
TITLE:El toque delicioso de tu celebración
TEL;TYPE=CELL,VOICE;VALUE=uri:tel:+${CONFIG.phone}
NOTE:Cotizaciones y reservaciones para eventos y celebraciones especiales. Desarrollado por AIT3D Software.
URL;TYPE=WORK:https://snackmat.mx
END:VCARD`;

      const blob = new Blob([vcardContent], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'SnackMat.vcf');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
  </script>

</body>

</html>
