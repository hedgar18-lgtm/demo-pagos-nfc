server {
    listen 80;
    server_name tudominio.com www.tudominio.com; # Cambia por tu dominio o IP del VPS

    root /var/www/ait3d-landing; # Ruta donde coloques los archivos en tu VPS
    index index.html;

    # Compresión Gzip para velocidad máxima
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Configuración de caché para imágenes y assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Rutas principales
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Seguridad básica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
